[package]
name = "connexia_core"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
anyhow = "1.0.104"
flutter_rust_bridge = "=2.13.0"
ironrdp = { version = "0.17.0", features = ["cliprdr", "connector", "session", "svc", "graphics"] }
ironrdp-blocking = "0.10.0"
ironrdp-graphics = "0.9.0"
ironrdp-pdu = "0.9.0"
libz-sys = { version = "1.1", features = ["static"] }
md-5 = "0.10"
num-bigint = "0.4"
rand = "0.9"
rustls = "0.23.45"
sha1 = "0.10"
sspi = { version = "0.21.1", features = ["network_client"] }
tracing = "0.1"
tokio = { version = "1.53.1", features = ["rt", "rt-multi-thread", "sync"] }
tokio-rustls = "0.26.5"
x509-cert = "0.2.5"

# Windows clipboard backend (ironrdp-cliprdr-native) and the Win32 message
# pump that drives it.
[target.'cfg(windows)'.dependencies]
clipboard-win = "5"
ironrdp-cliprdr-native = "0.7"
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging"] }

# Text-only local clipboard access on platforms without a native backend.
[target.'cfg(not(windows))'.dependencies]
arboard = "3.6"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(frb_expand)'] }

# Patched ironrdp-connector: upstream 0.10.0 rejects Standard RDP Security
# (`PROTOCOL_RDP`) outright. The vendored copy adds
# `Config::enable_standard_rdp_security`, which lets the client advertise and
# use the legacy no-encryption handshake that some servers require. Mirrors
# the change merged into IronRDP `main`.
#
# Patched ironrdp-cliprdr: the vendored copy relaxes the overly strict
# `FileContentsRequest` decode validations (real servers send mildly
# non-spec-conforming requests, e.g. SIZE requests with cbRequested != 8),
# processes coalesced CLIPRDR PDUs in a single channel payload, and forwards
# file contents requests to the backend even when the crate's own file-list
# model is unused (Connexia serves them from the OS clipboard directly).
[patch.crates-io]
ironrdp-connector = { path = "vendor/ironrdp-connector" }
ironrdp-cliprdr = { path = "vendor/ironrdp-cliprdr" }
