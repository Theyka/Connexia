name: Build & Release

# Builds Connexia for Windows and Android and attaches the artifacts to a
# GitHub Release. Run it by pushing a tag (e.g. `git tag v0.1.0 && git push
# origin v0.1.0`) or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Package (portable zip)
        shell: pwsh
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath connexia-windows-x64.zip
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\connexia.iss /DMyAppVersion=$version
          # Flatten the installer at the repo root: upload-artifact keeps
          # relative paths, and the release step's `artifacts/*` glob does
          # not recurse, so a nested setup.exe would never be attached.
          Copy-Item build\installer\connexia-setup.exe .\connexia-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-windows-x64
          path: |
            connexia-windows-x64.zip
            connexia-setup.exe

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-android
          path: build/app/outputs/flutter-apk/app-release.apk

  release:
    name: Publish release
    needs: [windows, android]
    runs-on: ubuntu-latest
    # Only attach artifacts to a release when the run was triggered by a tag.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connexia-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: connexia-android
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true
