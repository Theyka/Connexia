name: Build & Release

# Builds Connexia for Windows, Linux and Android and attaches the artifacts to
# a GitHub Release. Run it by pushing a tag (e.g. `git tag v0.1.0 && git push
# origin v0.1.0`) or manually from the Actions tab.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    name: Windows (x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build windows --release
      - name: Build installer (Inno Setup)
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $version = $env:GITHUB_REF_NAME.TrimStart('v')
          & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" installer\connexia.iss /DMyAppVersion=$version
          # Flatten the installer at the repo root: upload-artifact keeps
          # relative paths, and the release step's `artifacts/*` glob does
          # not recurse, so a nested setup.exe would never be attached.
          Copy-Item build\installer\connexia-setup.exe .\connexia-setup.exe
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-windows-x64
          path: connexia-setup.exe

  linux:
    name: Linux (x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libgtk-3-dev
      - run: flutter pub get
      - run: flutter build linux --release
      - name: Package (tar.gz)
        run: |
          cd build/linux/x64/release
          tar -czf ../../../../connexia-linux-x64.tar.gz bundle
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-linux-x64
          path: connexia-linux-x64.tar.gz

  android:
    name: Android (APK)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-android
          path: build/app/outputs/flutter-apk/app-release.apk

  server:
    name: Sync server (Linux + Windows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: 'stable'
          cache-dependency-path: server/go.sum
      - name: Build server (Linux x64)
        run: |
          cd server
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o syncserver .
      - name: Build server (Windows x64)
        run: |
          cd server
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -ldflags "-s -w" -o syncserver.exe .
      - name: Stage server binaries (flat names for the release glob)
        run: |
          mkdir -p staging
          cp server/syncserver staging/connexia-server-linux-x64
          cp server/syncserver.exe staging/connexia-server-windows-x64.exe
      - uses: actions/upload-artifact@v4
        with:
          name: connexia-server
          path: staging

  release:
    name: Publish release
    needs: [windows, linux, android, server]
    runs-on: ubuntu-latest
    # Only attach artifacts to a release when the run was triggered by a tag.
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: connexia-windows-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: connexia-linux-x64
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: connexia-android
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: connexia-server
          path: artifacts
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*
          fail_on_unmatched_files: true