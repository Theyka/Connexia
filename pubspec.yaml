name: connexia
description: "Connexia - a Termius-style SSH client and terminal emulator for Windows, macOS, Linux, iOS and Android."
publish_to: 'none'

version: 0.2.11+11

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  xterm:
    path: third_party/xterm
  dartssh2: ^2.22.5
  flutter_riverpod: ^2.6.1
  drift: ^2.28.0
  drift_flutter: ^0.2.6
  cryptography: ^2.7.0
  win32_registry: ^1.1.5
  file_picker: ^11.0.3
  path_provider: ^2.1.5
  path: ^1.9.0
  uuid: ^4.5.1
  window_manager: ^0.5.2
  desktop_drop: ^0.7.1
  font_awesome_flutter: 11.0.0
  http: ^1.2.0
  url_launcher: ^6.3.2
  connexia_core:
    path: rust_builder
  flutter_rust_bridge: 2.13.0
  freezed_annotation: ^3.1.0
  pointycastle: ^4.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  drift_dev: ^2.28.0
  build_runner: ^2.4.13
  freezed: ^3.2.5

flutter:
  uses-material-design: true
  assets:
    - assets/app_icon.png
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Variable.ttf
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Variable.ttf
