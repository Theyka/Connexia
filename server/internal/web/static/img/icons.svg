    which renders:        <svg class="ico"><use href="/assets/img/icons.svg#i-server"/></svg>

    Interface icons are strokes: size, colour and stroke width come from the
    .ico CSS class, so they are not set here. Brand icons are solid shapes
    (add the ico-fill class). The md-* icons are the dashboard's solid
    Material icons and carry their own fill.
