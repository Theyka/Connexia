{{define "login"}}<!DOCTYPE html>
<html lang="en">
<head>
{{template "pageHead" .}}
{{template "siteCSS"}}
{{template "tailwind" .}}
<style>
body{min-height:100vh}
</style>
</head>
<body>
<div class="auth grid grid-cols-1 min-h-screen lg:grid-cols-2">
{{template "authAside" .}}
  <div class="auth-form flex flex-col justify-center px-6 py-10 sm:px-12 lg:px-14 w-full max-w-full mx-auto lg:mx-0 lg:max-w-[520px]">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your Connexia account.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <div class="auth-row"><label for="password" style="margin:0">Password</label><a href="#" id="forgot">Forgot password?</a></div>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <button class="btn primary block lg" type="submit">Sign in</button>
    </form>

    <div id="totp" class="field" style="display:none">
      <label for="totp-code">Two-factor code</label>
      <input type="text" id="totp-code" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="6-digit code">
      <button class="btn primary block" id="totp-btn" type="button">Verify code</button>
    </div>

    <div id="auth-msg" class="auth-msg"></div>

    <p class="auth-alt">New here? <a href="/register">Create an account</a></p>
  </div>
</div>
<script src="/assets/site.js"></script>
<script src="/assets/login.js"></script>
</body>
</html>
{{end}}
