{{define "login"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "pageHead" .}}
  {{template "siteCSS"}}
</head>
<body>
<div class="auth">
  {{template "authAside" .}}

  <div class="auth-form">
    <h2>Welcome back</h2>
    <p class="sub">Sign in to your Connexia account.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>

      <div class="field">
        <div class="auth-row">
          <label for="password">Password</label>
          <a href="#" id="forgot">Forgot password?</a>
        </div>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>

      <button class="btn primary block lg" type="submit">Sign in</button>
    </form>

    <!-- Shown after a password sign-in when the account has 2FA enabled -->
    <div id="totp" class="field" style="display:none">
      <label for="totp-code">Two-factor code</label>
      <input
        type="text"
        id="totp-code"
        inputmode="numeric"
        autocomplete="one-time-code"
        maxlength="6"
        placeholder="6-digit code"
      >
      <button class="btn primary block" id="totp-btn" type="button">Verify code</button>
    </div>

    <div id="auth-msg" class="auth-msg"></div>

    <p class="auth-alt">New here? <a href="/register">Create an account</a></p>
  </div>
</div>

<script src="/assets/js/site.js"></script>
<script src="/assets/js/login.js"></script>
</body>
</html>
{{end}}
