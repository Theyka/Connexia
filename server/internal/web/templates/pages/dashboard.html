{{define "dashboard"}}
<!DOCTYPE html>
<html lang="en">
<head>
  {{template "pageHead" .}}
  <link rel="preload" href="/assets/fonts/Inter-Variable.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/assets/css/dashboard/base.css">
  <link rel="stylesheet" href="/assets/css/dashboard/shell.css">
  <link rel="stylesheet" href="/assets/css/dashboard/screens.css">
  <link rel="stylesheet" href="/assets/css/dashboard/panels.css">
  <link rel="stylesheet" href="/assets/css/dashboard/settings.css">
  <link rel="stylesheet" href="/assets/css/dashboard/metrics.css">
  <link rel="stylesheet" href="/assets/css/dashboard/sftp.css">
  <link rel="stylesheet" href="/assets/css/dashboard/terminal.css">
  <script type="module" src="/assets/js/dashboard/main.js"></script>
</head>
<body class="app">
  <header class="titlebar" id="titlebar"></header>
  <div class="mobile-sessions" id="mobile-sessions"></div>
  <nav class="mobilebar" id="mobilebar" aria-label="Sections"></nav>

  <div class="shell">
    <nav class="sidebar" aria-label="Sections">
      <div class="sidebar-list" id="sidebar-list"></div>
      <div class="sidebar-foot" id="sidebar-foot"></div>
    </nav>
    <main class="content" id="content"></main>
  </div>

  <noscript>The Connexia dashboard needs JavaScript.</noscript>
</body>
</html>
{{end}}
