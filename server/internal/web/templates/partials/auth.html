{{/* Left-hand brand panel on the login and register pages. */}}
{{define "authAside"}}
<aside class="auth-brand">
  {{template "brand" .}}

  <h1>{{.Headline}}</h1>
  <p>{{.Sub}}</p>

  <ul>
    {{range .Features}}
    <li>
      <svg
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="2.2"
        stroke-linecap="round"
        stroke-linejoin="round"
      >
        <path d="M4 12.5l5 5L20 6.5"/>
      </svg>
      {{.}}
    </li>
    {{end}}
  </ul>
</aside>
{{end}}
